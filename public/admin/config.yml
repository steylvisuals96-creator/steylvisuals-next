backend:
  name: git-gateway
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: projects
    label: Portfolio projecten
    folder: content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Titel, name: title, widget: string, hint: "bv. Appartement Leuven Centrum" }
      - { label: Locatie, name: location, widget: string, hint: "bv. Leuven" }
      - { label: Type service, name: serviceType, widget: select, options: ["Edit Only", "Starter", "Groei", "Drone shoot"] }
      - { label: Jaar, name: year, widget: string, hint: "bv. 2024" }
      - { label: Cover foto, name: coverImage, widget: image, required: false }
      - { label: Video URL, name: videoUrl, widget: string, required: false, hint: "YouTube of Vimeo embed URL" }
      - { label: Beschrijving, name: description, widget: text, required: false }
      - { label: Uitgelicht, name: featured, widget: boolean, default: false }
      - label: Extra foto's
        name: gallery
        widget: list
        required: false
        field: { label: Foto, name: image, widget: image }
